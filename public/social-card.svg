  <!-- Footer Domain Bar -->
  <g transform="translate(70, 555)">
    <line x1="0" y1="0" x2="1050" y2="0" stroke="#1E293B" stroke-width="1"/>
    <text x="0" y="26" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="14">成都 · 开放 Java 后端 / AI 落地协作</text>
    <text x="940" y="26" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700">alexai.top</text>
