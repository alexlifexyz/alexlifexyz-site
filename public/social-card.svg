<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#05070A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="card-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Deep space background -->
  <rect width="1200" height="630" fill="#05070A"/>
  <rect width="1200" height="630" fill="url(#card-grid)"/>
  <circle cx="950" cy="200" r="450" fill="url(#glow)"/>
  <circle cx="200" cy="450" r="380" fill="url(#glow)"/>

  <!-- Outer tech border -->
  <rect x="32" y="32" width="1136" height="566" rx="16" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Header bar -->
  <g transform="translate(70, 75)">
    <!-- Brand Mark Box -->
    <rect width="44" height="44" rx="10" fill="#090D12" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="1.2"/>
    <!-- Nexus A SVG inside 44x44 -->
    <g transform="translate(6, 6)">
      <path d="M6.5 27L16 6" stroke="#E8EEF4" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M25.5 27L16 6" stroke="#E8EEF4" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M11.4 18.6H20.6" stroke="#5EEAD4" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="16" cy="6" r="3" fill="#5EEAD4"/>
    </g>

    <!-- Brand Typography -->
    <text x="58" y="31" fill="#F4F6F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.03em">ALEX</text>
    <text x="130" y="31" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" opacity="0.7">::</text>
    <text x="156" y="31" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" letter-spacing="-0.02em">AI</text>

    <!-- Top Right Meta Tag -->
    <rect x="860" y="4" width="170" height="34" rx="6" fill="#0D1520" stroke="#1E293B" stroke-width="1"/>
    <circle cx="878" cy="21" r="4" fill="#10B981"/>
    <text x="892" y="27" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">LIVE PRODUCTION</text>
  </g>

  <!-- Main Hero Info -->
  <g transform="translate(70, 185)">
    <!-- Subtitle kicker -->
    <text x="0" y="30" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="600" letter-spacing="0.1em">JAVA ARCHITECTURE · ENTERPRISE RAG</text>

    <!-- Main Title -->
    <text x="0" y="90" fill="#F4F6F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.04em">
      何占伟 / Alex
    </text>

    <!-- Main Headline -->
    <text x="0" y="150" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.02em">
