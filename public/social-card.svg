      <text x="20" y="32" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">[PLATFORM]</text>
      <text x="20" y="55" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">微服务底座 / 高并发架构</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(360, 0)">
