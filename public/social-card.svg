      <text x="20" y="32" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">[LAB PRODUCTION]</text>
      <text x="20" y="55" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">rag.alexai.top 在线可验</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(720, 0)">
      <rect width="330" height="74" rx="10" fill="#090D13" stroke="#1E293B" stroke-width="1.2"/>
      <text x="20" y="32" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">[ENGINEERING]</text>
      <text x="20" y="55" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Java 21 / Spring Boot 3</text>
    </g>
